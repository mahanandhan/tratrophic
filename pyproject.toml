
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tratrophicai"
version = "0.1.0"
description = "An educational machine learning framework built from scratch using Python and NumPy"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tratrophicai*"]
